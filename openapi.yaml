openapi: 3.0.3
info:
  title: IDSC Clinic System API
  version: 1.0.0
  description: OpenAPI documentation for the IDSC Clinic System backend. Provides
    endpoints for managing student records, health records, clinical consultations,
    vital signs, medical histories, allergies, view-only health-record access for
    the Student Portal System, and health status records for the Faculty System.
paths:
  /api/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      description: Return a CSRF token and ensure the CSRF cookie is set.
      tags:
      - auth
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Authenticate a user and create a Django session.
      tags:
      - auth
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Log out the current authenticated user and destroy the session.
      tags:
      - auth
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Return information about the currently authenticated user.
      tags:
      - auth
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          description: No response body
  /api/consultations/:
    get:
      operationId: consultations_list
      description: Retrieve a list of all clinic consultations with optional filtering
        by student ID or search keyword.
      summary: List all consultations
      parameters:
      - in: query
        name: search
        schema:
          type: string
        description: Search keyword matching consultation notes or student ID
      - in: query
        name: student_id
        schema:
          type: string
        description: Filter consultations for a specific student by student ID
      tags:
      - Consultations
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Consultation'
          description: ''
    post:
      operationId: consultations_create
      description: Create a new clinic consultation associated with a student.
      summary: Create a consultation
      tags:
      - Consultations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsultationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConsultationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConsultationRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consultation'
          description: ''
  /api/consultations/{consultation_id}/:
    get:
      operationId: consultations_retrieve
      description: Retrieve details of a specific consultation by consultation_id.
      summary: Retrieve a consultation
      parameters:
      - in: path
        name: consultation_id
        schema:
          type: integer
          description: Unique consultation identifier
        required: true
      tags:
      - Consultations
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consultation'
          description: ''
    put:
      operationId: consultations_update
      description: Update all fields of an existing consultation.
      summary: Update a consultation
      parameters:
      - in: path
        name: consultation_id
        schema:
          type: integer
          description: Unique consultation identifier
        required: true
      tags:
      - Consultations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsultationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConsultationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConsultationRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consultation'
          description: ''
    patch:
      operationId: consultations_partial_update
      description: Partially update one or more fields of an existing consultation.
      summary: Partially update a consultation
      parameters:
      - in: path
        name: consultation_id
        schema:
          type: integer
          description: Unique consultation identifier
        required: true
      tags:
      - Consultations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedConsultationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedConsultationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedConsultationRequest'
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consultation'
          description: ''
    delete:
      operationId: consultations_destroy
      description: Delete an existing consultation by consultation_id.
      summary: Delete a consultation
      parameters:
      - in: path
        name: consultation_id
        schema:
          type: integer
          description: Unique consultation identifier
        required: true
      tags:
      - Consultations
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/health-records/:
    get:
      operationId: health_records_list
      description: Retrieve a list of all health records with optional filtering by
        student ID, blood type, or search keyword.
      summary: List all health records
      parameters:
      - in: query
        name: blood_type
        schema:
          type: string
          enum:
          - A+
          - A-
          - AB+
          - AB-
          - B+
          - B-
          - O+
          - O-
          - Unknown
        description: Filter health records by blood type
      - in: query
        name: search
        schema:
          type: string
        description: Search keyword matching allergies, consultation notes, medical
          history, or student ID
      - in: query
        name: student_id
        schema:
          type: string
        description: Filter health records for a specific student by student ID
      tags:
      - Health Records
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HealthRecord'
          description: ''
    post:
      operationId: health_records_create
      description: Create a new health record associated with a student.
      summary: Create a health record
      tags:
      - Health Records
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HealthRecordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/HealthRecordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/HealthRecordRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthRecord'
          description: ''
  /api/health-records/{health_id}/:
    get:
      operationId: health_records_retrieve
      description: Retrieve details of a specific health record by health_id.
      summary: Retrieve a health record
      parameters:
      - in: path
        name: health_id
        schema:
          type: integer
          description: Unique health record identifier
        required: true
      tags:
      - Health Records
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthRecord'
          description: ''
    put:
      operationId: health_records_update
      description: Update all fields of an existing health record.
      summary: Update a health record
      parameters:
      - in: path
        name: health_id
        schema:
          type: integer
          description: Unique health record identifier
        required: true
      tags:
      - Health Records
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HealthRecordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/HealthRecordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/HealthRecordRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthRecord'
          description: ''
    patch:
      operationId: health_records_partial_update
      description: Partially update one or more fields of an existing health record.
      summary: Partially update a health record
      parameters:
      - in: path
        name: health_id
        schema:
          type: integer
          description: Unique health record identifier
        required: true
      tags:
      - Health Records
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedHealthRecordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedHealthRecordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedHealthRecordRequest'
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthRecord'
          description: ''
    delete:
      operationId: health_records_destroy
      description: Delete an existing health record by health_id.
      summary: Delete a health record
      parameters:
      - in: path
        name: health_id
        schema:
          type: integer
          description: Unique health record identifier
        required: true
      tags:
      - Health Records
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '204':
          description: No response body
