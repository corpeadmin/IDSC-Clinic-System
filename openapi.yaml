  /api/student-portal/health-records/:
    get:
      operationId: student_portal_health_records_list
      description: View-only endpoint for the Student Portal System. Returns all available
        health-record data.
      summary: List all health records for the Student Portal
      tags:
      - Student Portal
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HealthRecord'
          description: ''
  /api/student-portal/health-records/{student_id}/:
    get:
      operationId: student_portal_health_records_retrieve
      description: View-only endpoint for the Student Portal System. Returns the health
        records associated with the specified student_id.
      summary: Retrieve a specific student's health records
      parameters:
      - in: path
        name: student_id
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      tags:
      - Student Portal
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HealthRecord'
          description: ''
  /api/students/:
    get:
      operationId: students_list
      description: Retrieve a list of all students with optional search by student
        ID.
      summary: List all students
      parameters:
      - in: query
        name: search
        schema:
          type: string
        description: Search keyword matching student ID
      tags:
      - Students
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Student'
          description: ''
    post:
      operationId: students_create
      description: Register a new student record in the IDSC Clinic System with an
        externally supplied student_id.
      summary: Create a new student
      tags:
      - Students
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StudentRequest'
          multipart/form-data:
            schema:
