openapi: 3.0.3
info:
  title: IDSC Clinic System API
  version: 1.0.0
  description: OpenAPI documentation for the IDSC Clinic System backend. Provides
    endpoints for managing student records, health records, clinical consultations,
    vital signs, medical histories, and allergies.
paths:
  /api/health-records/:
    get:
      operationId: health_records_list
      description: Retrieve a list of all health records with optional filtering by
        student ID, blood type, or search keyword.
      summary: List all health records
      parameters:
      - in: query
        name: blood_type
        schema:
          type: string
          enum:
          - A+
          - A-
          - AB+
          - AB-
          - B+
          - B-
          - O+
          - O-
          - Unknown
        description: Filter health records by blood type
      - in: query
        name: search
        schema:
          type: string
        description: Search keyword matching student name, allergies, consultation
          notes, medical history, or student ID
      - in: query
        name: student_id
        schema:
          type: string
        description: Filter health records for a specific student by student ID
      tags:
      - Health Records
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HealthRecord'
          description: ''
    post:
      operationId: health_records_create
      description: Create a new clinic consultation / health record associated with
        a student.
      summary: Create a health record
      tags:
      - Health Records
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HealthRecordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/HealthRecordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/HealthRecordRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthRecord'
          description: ''
  /api/health-records/{health_id}/:
    get:
      operationId: health_records_retrieve
      description: Retrieve details of a specific health record by health_id.
      summary: Retrieve a health record
      parameters:
      - in: path
        name: health_id
        schema:
          type: integer
          description: Unique health record identifier
        required: true
      tags:
      - Health Records
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthRecord'
          description: ''
    put:
      operationId: health_records_update
      description: Update all fields of an existing health record.
      summary: Update a health record
      parameters:
      - in: path
        name: health_id
        schema:
          type: integer
          description: Unique health record identifier
        required: true
      tags:
      - Health Records
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HealthRecordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/HealthRecordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/HealthRecordRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthRecord'
          description: ''
    patch:
      operationId: health_records_partial_update
      description: Partially update one or more fields of an existing health record.
      summary: Partially update a health record
      parameters:
      - in: path
        name: health_id
        schema:
          type: integer
          description: Unique health record identifier
        required: true
      tags:
      - Health Records
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedHealthRecordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedHealthRecordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedHealthRecordRequest'
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthRecord'
          description: ''
    delete:
      operationId: health_records_destroy
      description: Delete an existing health record by health_id.
      summary: Delete a health record
      parameters:
      - in: path
        name: health_id
        schema:
          type: integer
          description: Unique health record identifier
        required: true
      tags:
      - Health Records
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/students/:
    get:
      operationId: students_list
      description: Retrieve a list of all students with optional search and filtering
        by course, section, or sex.
      summary: List all students
      parameters:
      - in: query
        name: course
        schema:
          type: string
        description: Filter by degree program / course (case-insensitive exact match)
      - in: query
        name: search
        schema:
          type: string
        description: Search keyword matching first name, last name, course, section,
          or student ID
      - in: query
        name: section
        schema:
          type: string
        description: Filter by section (case-insensitive exact match)
      - in: query
        name: sex
        schema:
          type: string
          enum:
          - Female
          - Male
          - Other
        description: Filter by sex (Male, Female, Other)
      tags:
      - Students
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Student'
          description: ''
    post:
      operationId: students_create
      description: Register a new student record in the IDSC Clinic System.
      summary: Create a new student
      tags:
      - Students
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StudentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StudentRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
          description: ''
  /api/students/{student_id}/:
    get:
      operationId: students_retrieve
      description: Retrieve complete details for a specific student by student_id,
        including full nested health records history.
      summary: Retrieve student details
      parameters:
      - in: path
        name: student_id
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      tags:
      - Students
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentDetail'
          description: ''
    put:
      operationId: students_update
      description: Update all fields of an existing student record.
      summary: Update a student
      parameters:
      - in: path
        name: student_id
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      tags:
      - Students
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StudentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StudentRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
          description: ''
    patch:
      operationId: students_partial_update
      description: Partially update one or more fields of an existing student record.
      summary: Partially update a student
      parameters:
      - in: path
        name: student_id
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      tags:
      - Students
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedStudentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedStudentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedStudentRequest'
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
          description: ''
    delete:
      operationId: students_destroy
      description: Delete an existing student and all associated health records.
      summary: Delete a student
      parameters:
      - in: path
        name: student_id
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      tags:
      - Students
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/students/{student_id}/health-records/:
    get:
      operationId: students_health_records_list
      description: Retrieve all health records and clinic consultations for a specific
        student, ordered by visit date descending.
      summary: List health records for a student
      parameters:
      - in: path
        name: student_id
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      tags:
      - Students
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HealthRecord'
          description: ''
    post:
      operationId: students_health_records_create
      description: Create a new clinic consultation / health record for the specified
        student.
      summary: Create health record for a student
      parameters:
      - in: path
        name: student_id
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      tags:
      - Students
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HealthRecordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/HealthRecordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/HealthRecordRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthRecord'
          description: ''
components:
  schemas:
    BlankEnum:
      enum:
      - ''
    BloodTypeEnum:
      enum:
      - A+
      - A-
      - B+
      - B-
      - AB+
      - AB-
      - O+
      - O-
      - Unknown
      type: string
      description: |-
        * `A+` - A+
        * `A-` - A-
        * `B+` - B+
        * `B-` - B-
        * `AB+` - AB+
        * `AB-` - AB-
        * `O+` - O+
        * `O-` - O-
        * `Unknown` - Unknown
    HealthRecord:
      type: object
      description: |-
        Serializer for the HealthRecord model.
        Handles foreign-key relationship with Student via student_id.
      properties:
        health_id:
          type: integer
          readOnly: true
          description: Unique health record identifier
        student_id:
          type: integer
          description: The ID of the student associated with this health record
        student_name:
          type: string
          readOnly: true
        allergies:
          type: string
          description: Known allergies (e.g. penicillin, peanuts, pollen)
        blood_type:
          description: |-
            Blood type (e.g. A+, O+, etc.)

            * `A+` - A+
            * `A-` - A-
            * `B+` - B+
            * `B-` - B-
            * `AB+` - AB+
            * `AB-` - AB-
            * `O+` - O+
            * `O-` - O-
            * `Unknown` - Unknown
          oneOf:
          - $ref: '#/components/schemas/BloodTypeEnum'
          - $ref: '#/components/schemas/BlankEnum'
        medical_history:
          type: string
          description: Past medical history and chronic conditions (e.g. Asthma, Hypertension)
        medication:
          type: string
          description: Current medications and prescriptions
        weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          nullable: true
          description: Weight in kilograms (kg)
        height:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          nullable: true
          description: Height in centimeters (cm)
        visit:
          type: string
          format: date-time
          description: Date and time of clinic visit
        consultation:
          type: string
          description: Clinic consultation notes, diagnosis, and treatment provided
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when health record was created
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when health record was last updated
      required:
      - created_at
      - health_id
      - student_id
      - student_name
      - updated_at
    HealthRecordRequest:
      type: object
      description: |-
        Serializer for the HealthRecord model.
        Handles foreign-key relationship with Student via student_id.
      properties:
        student_id:
          type: integer
          description: The ID of the student associated with this health record
        allergies:
          type: string
          description: Known allergies (e.g. penicillin, peanuts, pollen)
        blood_type:
          description: |-
            Blood type (e.g. A+, O+, etc.)

            * `A+` - A+
            * `A-` - A-
            * `B+` - B+
            * `B-` - B-
            * `AB+` - AB+
            * `AB-` - AB-
            * `O+` - O+
            * `O-` - O-
            * `Unknown` - Unknown
          oneOf:
          - $ref: '#/components/schemas/BloodTypeEnum'
          - $ref: '#/components/schemas/BlankEnum'
        medical_history:
          type: string
          description: Past medical history and chronic conditions (e.g. Asthma, Hypertension)
        medication:
          type: string
          description: Current medications and prescriptions
        weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          nullable: true
          description: Weight in kilograms (kg)
        height:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          nullable: true
          description: Height in centimeters (cm)
        visit:
          type: string
          format: date-time
          description: Date and time of clinic visit
        consultation:
          type: string
          description: Clinic consultation notes, diagnosis, and treatment provided
      required:
      - student_id
    PatchedHealthRecordRequest:
      type: object
      description: |-
        Serializer for the HealthRecord model.
        Handles foreign-key relationship with Student via student_id.
      properties:
        student_id:
          type: integer
          description: The ID of the student associated with this health record
        allergies:
          type: string
          description: Known allergies (e.g. penicillin, peanuts, pollen)
        blood_type:
          description: |-
            Blood type (e.g. A+, O+, etc.)

            * `A+` - A+
            * `A-` - A-
            * `B+` - B+
            * `B-` - B-
            * `AB+` - AB+
            * `AB-` - AB-
            * `O+` - O+
            * `O-` - O-
            * `Unknown` - Unknown
          oneOf:
          - $ref: '#/components/schemas/BloodTypeEnum'
          - $ref: '#/components/schemas/BlankEnum'
        medical_history:
          type: string
          description: Past medical history and chronic conditions (e.g. Asthma, Hypertension)
        medication:
          type: string
          description: Current medications and prescriptions
        weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          nullable: true
          description: Weight in kilograms (kg)
        height:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          nullable: true
          description: Height in centimeters (cm)
        visit:
          type: string
          format: date-time
          description: Date and time of clinic visit
        consultation:
          type: string
          description: Clinic consultation notes, diagnosis, and treatment provided
    PatchedStudentRequest:
      type: object
      description: |-
        Serializer for the Student model.
        Handles student CRUD with validation on unique student_id and fields.
      properties:
        first_name:
          type: string
          minLength: 1
          description: Student's first name
          maxLength: 100
        last_name:
          type: string
          minLength: 1
          description: Student's last name
          maxLength: 100
        birth_date:
          type: string
          format: date
          nullable: true
          description: Date of birth (YYYY-MM-DD)
        sex:
          description: |-
            Student's sex/gender

            * `Male` - Male
            * `Female` - Female
            * `Other` - Other
          oneOf:
          - $ref: '#/components/schemas/SexEnum'
          - $ref: '#/components/schemas/BlankEnum'
        course:
          type: string
          minLength: 1
          description: Degree program or course (e.g. BSIT, BSCS, BSN)
          maxLength: 100
        section:
          type: string
          minLength: 1
          description: Class section (e.g. 3A, 1-1, CS401)
          maxLength: 50
        contact_no:
          type: string
          description: Contact number or mobile phone
          maxLength: 30
    SexEnum:
      enum:
      - Male
      - Female
      - Other
      type: string
      description: |-
        * `Male` - Male
        * `Female` - Female
        * `Other` - Other
    Student:
      type: object
      description: |-
        Serializer for the Student model.
        Handles student CRUD with validation on unique student_id and fields.
      properties:
        student_id:
          type: integer
          readOnly: true
          description: Auto-incrementing unique student identifier
        first_name:
          type: string
          description: Student's first name
          maxLength: 100
        last_name:
          type: string
          description: Student's last name
          maxLength: 100
        birth_date:
          type: string
          format: date
          nullable: true
          description: Date of birth (YYYY-MM-DD)
        sex:
          description: |-
            Student's sex/gender

            * `Male` - Male
            * `Female` - Female
            * `Other` - Other
          oneOf:
          - $ref: '#/components/schemas/SexEnum'
          - $ref: '#/components/schemas/BlankEnum'
        course:
          type: string
          description: Degree program or course (e.g. BSIT, BSCS, BSN)
          maxLength: 100
        section:
          type: string
          description: Class section (e.g. 3A, 1-1, CS401)
          maxLength: 50
        contact_no:
          type: string
          description: Contact number or mobile phone
          maxLength: 30
        health_records_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when student record was created
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when student record was last updated
      required:
      - course
      - created_at
      - first_name
      - health_records_count
      - last_name
      - section
      - student_id
      - updated_at
    StudentDetail:
      type: object
      description: Detailed Student Serializer including nested health records history.
      properties:
        student_id:
          type: integer
          readOnly: true
          description: Auto-incrementing unique student identifier
        first_name:
          type: string
          description: Student's first name
          maxLength: 100
        last_name:
          type: string
          description: Student's last name
          maxLength: 100
        birth_date:
          type: string
          format: date
          nullable: true
          description: Date of birth (YYYY-MM-DD)
        sex:
          description: |-
            Student's sex/gender

            * `Male` - Male
            * `Female` - Female
            * `Other` - Other
          oneOf:
          - $ref: '#/components/schemas/SexEnum'
          - $ref: '#/components/schemas/BlankEnum'
        course:
          type: string
          description: Degree program or course (e.g. BSIT, BSCS, BSN)
          maxLength: 100
        section:
          type: string
          description: Class section (e.g. 3A, 1-1, CS401)
          maxLength: 50
        contact_no:
          type: string
          description: Contact number or mobile phone
          maxLength: 30
        health_records_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when student record was created
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when student record was last updated
        health_records:
          type: array
          items:
            $ref: '#/components/schemas/HealthRecord'
          readOnly: true
      required:
      - course
      - created_at
      - first_name
      - health_records
      - health_records_count
      - last_name
      - section
      - student_id
      - updated_at
    StudentRequest:
      type: object
      description: |-
        Serializer for the Student model.
        Handles student CRUD with validation on unique student_id and fields.
      properties:
        first_name:
          type: string
          minLength: 1
          description: Student's first name
          maxLength: 100
        last_name:
          type: string
          minLength: 1
          description: Student's last name
          maxLength: 100
        birth_date:
          type: string
          format: date
          nullable: true
          description: Date of birth (YYYY-MM-DD)
        sex:
          description: |-
            Student's sex/gender

            * `Male` - Male
            * `Female` - Female
            * `Other` - Other
          oneOf:
          - $ref: '#/components/schemas/SexEnum'
          - $ref: '#/components/schemas/BlankEnum'
        course:
          type: string
          minLength: 1
          description: Degree program or course (e.g. BSIT, BSCS, BSN)
          maxLength: 100
        section:
          type: string
          minLength: 1
          description: Class section (e.g. 3A, 1-1, CS401)
          maxLength: 50
        contact_no:
          type: string
          description: Contact number or mobile phone
          maxLength: 30
      required:
      - course
      - first_name
      - last_name
      - section
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
