      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HealthRecord'
          description: ''
    post:
      operationId: students_health_records_create
      description: Create a new health record for the specified student.
      summary: Create health record for a student
      parameters:
      - in: path
        name: student_id
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      tags:
      - Students
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HealthRecordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/HealthRecordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/HealthRecordRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthRecord'
          description: ''
components:
  schemas:
    BlankEnum:
      enum:
      - ''
    BloodTypeEnum:
      enum:
      - A+
      - A-
      - B+
      - B-
      - AB+
      - AB-
      - O+
      - O-
      - Unknown
      type: string
      description: |-
        * `A+` - A+
        * `A-` - A-
        * `B+` - B+
        * `B-` - B-
        * `AB+` - AB+
        * `AB-` - AB-
        * `O+` - O+
        * `O-` - O-
        * `Unknown` - Unknown
    Consultation:
      type: object
      description: |-
        Serializer for the Consultation model.
        Handles foreign-key relationship with Student via student_id.
      properties:
        consultation_id:
          type: integer
          readOnly: true
          description: Unique consultation identifier
        student_id:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: The ID of the student associated with this consultation
        consultation:
          type: string
          description: Clinic consultation notes, diagnosis, and treatment provided
        visits:
          type: string
          format: date-time
          description: Date and time of clinic visit
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when consultation was created
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when consultation was last updated
      required:
      - consultation_id
      - created_at
      - student_id
      - updated_at
    ConsultationRequest:
      type: object
      description: |-
        Serializer for the Consultation model.
        Handles foreign-key relationship with Student via student_id.
      properties:
        student_id:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: The ID of the student associated with this consultation
        consultation:
          type: string
          description: Clinic consultation notes, diagnosis, and treatment provided
        visits:
          type: string
          format: date-time
          description: Date and time of clinic visit
      required:
      - student_id
    HealthRecord:
      type: object
      description: |-
        Serializer for the HealthRecord model.
        Handles foreign-key relationship with Student via student_id.
